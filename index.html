<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kanji Flashcards</title>
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="app-header">
        <h1>Kanji Flashcards</h1>
        <p class="subtitle">Learn kanji with readings and meanings — N4 lessons</p>
      </div>

      <section class="card-area">
        <div id="card" class="card">
          <div class="card-inner" id="card-inner">
            <div class="card-face card-front" id="card-front"></div>
            <div class="card-face card-back" id="card-back">
              <div id="card-reading" class="card-reading"></div>
              <div id="card-meaning" class="card-meaning"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="controls">
        <button id="prev">◀ Prev</button>
        <button id="flip">Flip</button>
        <button id="next">Next ▶</button>
        <button id="shuffle">Shuffle</button>
      </div>

      <div id="status" class="status">Loading cards…</div>

      <p class="note">Tip: serve this folder with a local HTTP server (eg. <code>python -m http.server</code>) to allow CSV loading.</p>
    </main>

    <script src="static/app.js" defer></script>
  </body>
</html>
